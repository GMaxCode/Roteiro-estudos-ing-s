<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inglês sem legenda: roteiro de 8 semanas</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
:root{--bg:#f6f5f0;--card:#fff;--ink:#17202a;--mute:#5f6b76;--line:#dcd9cf;--pri:#0f4c5c;--acc:#f2b134;--ok:#2f8f5b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a1f;--card:#1a252c;--ink:#eceae2;--mute:#9aa7b0;--line:#2c3b44;--pri:#7cc4d4;--acc:#f2b134;--ok:#5cc48a;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif}
.w{max-width:860px;margin:0 auto;padding:20px 16px 56px}
h1{font-size:clamp(28px,6vw,44px);line-height:1.05;margin:0 0 4px;font-weight:800;letter-spacing:-.02em}
.sub{color:var(--mute);margin:0 0 18px}
.top{position:sticky;top:0;background:var(--bg);padding:10px 0 12px;z-index:5;border-bottom:1px solid var(--line)}
.pct{display:flex;align-items:baseline;gap:10px}
.pct b{font-size:44px;font-weight:800;color:var(--pri)}
.bar{height:12px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .4s}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:14px 0}
.tabs button{flex:0 0 auto;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 14px;font:inherit;cursor:pointer}
.tabs button[aria-selected=true]{background:var(--pri);border-color:var(--pri);color:var(--bg)}
.tabs small{display:block;font-size:12px;opacity:.8}
h2{font-size:26px;margin:6px 0 2px}
.g{background:var(--card);border-left:5px solid var(--acc);padding:10px 14px;border-radius:6px;margin:12px 0}
h3{font-size:17px;margin:20px 0 8px}
ul{margin:0;padding-left:20px}
details{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 14px}
summary{cursor:pointer;font-weight:600}
.v{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:4px 16px;margin:10px 0 0;padding:0;list-style:none;font-size:15px}
.v span{color:var(--mute)}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.days button{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:10px;font:inherit;text-align:left;cursor:pointer}
.days button.done{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--card))}
.days button[aria-expanded=true]{outline:3px solid var(--acc)}
.days small{display:block;color:var(--mute)}
.det{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-top:12px}
.det h4{margin:0 0 8px;font-size:20px}
.bl{display:grid;grid-template-columns:64px 1fr;gap:4px 12px;padding:10px 0;border-top:1px solid var(--line)}
.bl b{color:var(--pri)}
.bl em{color:var(--mute);font-style:normal;font-size:14px;grid-column:2}
.ok{margin-top:12px;border:0;border-radius:10px;padding:12px 18px;font:inherit;font-weight:600;background:var(--pri);color:var(--bg);cursor:pointer}
button:focus-visible,summary:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
</style></head><body><div class="w">
<div class="top"><h1>Inglês sem legenda</h1>
<div class="pct"><b id="p">0%</b><span id="pt" class="sub" style="margin:0"></span></div>
<div class="bar"><i id="pb"></i></div></div>
<div class="tabs" id="tabs" role="tablist"></div>
<main id="m"></main>
<p class="sub">30 min por dia de estudo ativo. O resto do dia é imersão: celular em inglês, áudio do barril nos tempos mortos e frases em voz alta.</p>
</div>

];
const D=[
["Segunda","Input compreensível",[[15,"Assista a 1 vídeo do barril sobre {t}, sem legenda em português. Primeira vez: só o sentido geral. Segunda vez: pause nas frases novas. Busca sugerida: “{q}”.",0],[10,"Sentence mining: escolha 3 frases que você entendeu pela metade e crie cartões no Anki (frase inteira, com áudio).",3],[5,"Micro-hábito: descreva em voz alta, em inglês, o que está ao seu redor.",3]]],
["Terça","Shadowing e chorusing",[[12,"Shadowing: pegue um trecho de 30 segundos sobre {t}, repita junto com o áudio 5 vezes, depois sem olhar a transcrição.",1],[8,"Chorusing: fale a mesma frase em coro com o nativo até igualar ritmo e entonação.",1],[10,"Flashcards: revise os cartões vencidos no Anki.",3]]],
["Quarta","Interação e roleplay",[[15,"Reassista uma cena que você já viu. Pause e responda os personagens em voz alta, faça perguntas e dê opiniões. Anote o que não soube dizer.",0],[10,"Roleplay com a IA: simule uma situação real de {t}. Peça para ela responder só em inglês simples e corrigir no fim.",3],[5,"Pesquise como falar as lacunas anotadas e crie 2 cartões.",3]]],
["Quinta","Gramática em uso",[[8,"Tópico da semana: {g}. Leia 10 exemplos e tente achar o padrão antes de ler a regra.",2],[12,"Escrita ativa: escreva 5 a 8 frases sobre {t} usando o tópico. Cole na IA e peça correção com explicação curta.",3],[10,"Flashcards: revise e acrescente as correções como cartões.",3]]],
["Sexta","Áudio e fala",[[20,"Ouça 1 episódio curto sobre {t} ou sobre rotina e vida cotidiana. Ouça duas vezes: sem pausar e depois pausando para anotar palavras.",2],[10,"Grave 1 minuto resumindo em voz alta o que entendeu. Ouça sua gravação e repita uma versão melhor.",3]]],
["Sábado","Revisão e vocabulário",[[10,"Flashcards: revise tudo da semana.",3],[10,"Revise as 70+ palavras da lista da semana: fale cada uma dentro de uma frase sua.",3],[10,"Roleplay livre com a IA, sem script, sobre {t}.",3]]],
["Domingo","Imersão leve",[[20,"Assista a série, vídeo ou ouça podcast por prazer, em inglês, sem pressão. Não pare para estudar.",0],[10,"Diário falado: fale 1 minuto sobre sua semana, em inglês, sem traduzir antes.",3]]]
];
let S={};try{S=JSON.parse(localStorage.getItem("ing")||"{}")}catch(e){}
let cw=0,cd=null;
const $=i=>document.getElementById(i),save=()=>{try{localStorage.setItem("ing",JSON.stringify(S))}catch(e){}};
const cnt=w=>D.filter((_,d)=>S[w+"-"+d]).length;
function upd(){const n=Object.values(S).filter(Boolean).length,p=Math.round(n/56*100);$("p").textContent=p+"%";$("pb").style.width=p+"%";$("pt").textContent=n+" de 56 dias concluídos"}
function tabs(){$("tabs").innerHTML="";Wk.forEach((w,i)=>{const b=document.createElement("button");b.setAttribute("role","tab");b.setAttribute("aria-selected",i==cw);b.innerHTML="Semana "+(i+1)+"<small>"+cnt(i)+"/7</small>";b.onclick=()=>{cw=i;cd=null;draw()};$("tabs").appendChild(b)})}
function fill(s,w){return s.replace(/{t}/g,w.t.toLowerCase()).replace(/{g}/g,w.g).replace(/{q}/g,w.q)}
function draw(){tabs();upd();const w=Wk[cw],V=w.v.split(";").map(x=>x.split("="));
let h="<h2>Semana "+(cw+1)+": "+w.t+"</h2><div class='g'><b>Gramática:</b> "+w.g+"</div>";
h+="<details><summary>Vocabulário ("+V.length+" palavras)</summary><ul class='v'>"+V.map(x=>"<li>"+x[0]+" <span>"+x[1]+"</span></li>").join("")+"</ul></details>";
h+="<h3>Recursos desta semana</h3><ul>"+R.map(r=>"<li>"+r+"</li>").join("")+"<li>Barril de conteúdos: salve numa pasta 5 vídeos e 3 episódios com a busca “"+w.q+"”.</li></ul>";
h+="<h3>Dias</h3><div class='days'>"+D.map((d,i)=>"<button class='"+(S[cw+"-"+i]?"done":"")+"' aria-expanded='"+(cd===i)+"' data-d='"+i+"'>"+d[0]+"<small>"+(S[cw+"-"+i]?"Concluído":d[1])+"</small></button>").join("")+"</div>";
if(cd!==null){const d=D[cd],k=cw+"-"+cd;h+="<div class='det'><h4>"+d[0]+": "+d[1]+" (30 min)</h4>"+d[2].map(b=>"<div class='bl'><b>"+b[0]+" min</b><span>"+fill(b[1],w)+"</span><em>Recurso: "+R[b[2]]+"</em></div>").join("")+"<button class='ok' data-k='"+k+"'>"+(S[k]?"Desmarcar dia":"Marcar como concluído")+"</button></div>"}
$("m").innerHTML=h;
$("m").querySelectorAll(".days button").forEach(b=>b.onclick=()=>{const i=+b.dataset.d;cd=cd===i?null:i;draw()});
const ok=$("m").querySelector(".ok");if(ok)ok.onclick=()=>{S[ok.dataset.k]=!S[ok.dataset.k];save();draw()}}
draw();
</script></body></html>
